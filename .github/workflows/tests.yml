name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['12.*', '13.*']
        # Must be a base axis, not an include-only key. An include entry that
        # names only keys already matching a base combination gets *merged into*
        # that combination instead of appending a row, so the Filament rows below
        # would silently collapse onto one 8.4/13.* row and no alternate major
        # would ever be tested. Listing it here forces them to overwrite, which
        # is what makes them separate rows.
        filament: ['^5.7.6']
        experimental: [false]
        include:
          # The base rows above test the default dev toolchain, which pins
          # Filament 5. The optional admin resource also supports v4 and v3, so
          # each gets one row rather than a full cross-product: the Filament
          # major is independent of the PHP and Laravel axes, and v3 and v4 pull
          # livewire 3 where v5 pulls livewire 4, so the majors can never be
          # installed side by side. The 'none' row proves the package still
          # works with no Filament at all.
          - php: '8.4'
            laravel: '13.*'
            filament: '^4.12'
            experimental: false
          - php: '8.4'
            laravel: '13.*'
            filament: '^3.3'
            experimental: false
          - php: '8.4'
            laravel: '13.*'
            filament: 'none'
            experimental: false
          # PHP 8.6 is not released yet; nightly builds it from master. Advisory
          # only, so a break there never fails the build. Promote it to the php
          # list above once 8.6 ships.
          - php: 'nightly'
            laravel: '13.*'
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Filament ${{ matrix.filament }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          FILAMENT: ${{ matrix.filament }}
          EXPERIMENTAL: ${{ matrix.experimental }}
        run: |
          composer require "illuminate/support:$LARAVEL" --no-interaction --no-update
          if [ "$FILAMENT" = "none" ]; then
            composer remove --dev filament/filament --no-interaction --no-update
          elif [ -n "$FILAMENT" ]; then
            # Livewire needs no step-back here: filament 3 and 4 both require
            # livewire ^3.5 transitively, so composer picks it on its own.
            composer require --dev "filament/filament:$FILAMENT" --no-interaction --no-update
          fi
          if [ "$LARAVEL" = "12.*" ]; then
            # The default dev toolchain targets Laravel 13: pest 5 and
            # testbench 11 both require laravel/framework ^13.23.0. Step the
            # test tooling back one major for this row. pest-plugin-rector only
            # exists on the 5.x line and conflicts with pest <5, and the
            # explicit phpunit pin conflicts with testbench 10, so both go.
            composer require --dev \
              "orchestra/testbench:^10.0" \
              "pestphp/pest:^4.1" \
              "pestphp/pest-plugin-laravel:^4.0" \
              "pestphp/pest-plugin-browser:^4.0" \
              --no-interaction --no-update
            composer remove --dev phpunit/phpunit pestphp/pest-plugin-rector \
              --no-interaction --no-update
          fi
          if [ "$EXPERIMENTAL" = "true" ]; then
            # Parts of the test toolchain declare an upper PHP bound and so
            # refuse to install on an unreleased version: filament pulls
            # nette/php-generator (php 8.1 - 8.5), and pest pulls
            # brianium/paratest (~8.4.0 || ~8.5.0). Drop the optional Filament
            # dependency, whose tests already self-skip when it is absent, and
            # ignore the remaining platform bounds so the suite actually runs
            # against the new engine. This row is advisory and cannot fail the
            # build.
            composer remove filament/filament --dev --no-interaction --no-update
            composer update --prefer-dist --no-interaction --ignore-platform-req=php
          else
            composer update --prefer-dist --no-interaction
          fi
      - name: Run Pint
        run: vendor/bin/pint --test
      - name: Run tests (Unit + Feature)
        run: vendor/bin/pest --testsuite=Unit,Feature

  browser-tests:
    runs-on: ubuntu-latest
    name: Browser tests (PHP 8.4)
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install PHP dependencies
        run: composer update --prefer-dist --no-interaction
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: vendor/bin/pest --testsuite=Browser
