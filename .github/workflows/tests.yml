name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        experimental: [false]
        include:
          # PHP 8.6 is not released yet; nightly builds it from master. Advisory
          # only, so a break there never fails the build. Promote it to the php
          # list above once 8.6 ships.
          - php: 'nightly'
            laravel: '13.*'
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          EXPERIMENTAL: ${{ matrix.experimental }}
        run: |
          composer require "illuminate/support:$LARAVEL" --no-interaction --no-update
          # filament pulls nette/php-generator, which caps at PHP 8.5 and so
          # blocks the unreleased-PHP row. The Filament tests self-skip when it
          # is absent, so drop it there rather than lose the whole row.
          if [ "$EXPERIMENTAL" = "true" ]; then
            composer remove filament/filament --dev --no-interaction --no-update
          fi
          composer update --prefer-dist --no-interaction
      - name: Run Pint
        run: vendor/bin/pint --test
      - name: Run tests (Unit + Feature)
        run: vendor/bin/pest --testsuite=Unit,Feature

  browser-tests:
    runs-on: ubuntu-latest
    name: Browser tests (PHP 8.4)
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install PHP dependencies
        run: composer update --prefer-dist --no-interaction
      - name: Install Node dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: vendor/bin/pest --testsuite=Browser
